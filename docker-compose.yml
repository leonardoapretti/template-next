services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - env

    image: template-next-app:latest
    container_name: template-next-app
    restart: unless-stopped
    init: true

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3000:3000"

    # Critério de "deploy deu certo" (deploy.sh usa `up --wait`). start_period
    # cobre o `prisma migrate deploy` que o entrypoint roda antes do server.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: postgres:17
    container_name: template-next-postgres
    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: America/Sao_Paulo

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:

secrets:
  env:
    file: .env
