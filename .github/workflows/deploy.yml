name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-template-next
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest

    # Credenciais do Postgres de serviço abaixo (postgres/postgres) são fixas e
    # propositalmente triviais: o container é criado do zero neste job e
    # destruído ao final, sem persistência e sem exposição fora do runner.
    # Não reutilize essas credenciais em nenhum banco real.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: template
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d template"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/template"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "template"
      NEXTAUTH_URL: ${{ secrets.CI_NEXTAUTH_URL }}
      NEXTAUTH_SECRET: ${{ secrets.CI_NEXTAUTH_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Produção: qualquer severidade bloqueia. Dev/CI (tsx, vitest, eslint, shadcn...)
      # roda no runner com acesso aos secrets, então high/critical também bloqueia.
      - run: pnpm audit --prod
      - run: pnpm audit --audit-level=high

      - run: pnpm exec prisma generate

      - run: pnpm exec fumadocs-mdx

      - run: pnpm exec prisma migrate deploy

      - run: pnpm lint

      - run: pnpm exec tsc --noEmit

      - run: pnpm test

      # Varredura de configuração (Dockerfile) e segredos no repo; HIGH/CRITICAL bloqueia.
      - name: Trivy (config e segredos)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"

  deploy:
    name: Build e deploy na VPS
    needs: quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          # Fingerprint do host conferida uma vez e guardada no secret
          # (ssh-keyscan no pipeline seria confiança no primeiro uso).
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

      - name: Enviar código para a VPS
        run: |
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "mkdir -p /var/www/template-next"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude '.next' \
            --exclude 'generated' \
            -e "ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519" \
            ./ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/template-next/"

      - name: Rodar deploy.sh na VPS
        run: |
          ssh -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "bash /var/www/template-next/scripts/deploy.sh"

      - name: Limpar chave SSH
        if: always()
        run: rm -f ~/.ssh/id_ed25519 ~/.ssh/known_hosts
