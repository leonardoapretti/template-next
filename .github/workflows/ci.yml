name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DB_HOST: ${{ secrets.CI_DB_HOST }}
      DB_PORT: ${{ secrets.CI_DB_PORT }}
      DB_USER: ${{ secrets.CI_DB_USER }}
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      DB_NAME: ${{ secrets.CI_DB_NAME }}
      NEXTAUTH_URL: ${{ secrets.CI_NEXTAUTH_URL }}
      NEXTAUTH_SECRET: ${{ secrets.CI_NEXTAUTH_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm audit --prod

      - run: pnpm exec prisma generate

      - run: pnpm lint

      - run: pnpm exec tsc --noEmit

      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest

    # Credenciais do MySQL de serviço abaixo (root/root) são fixas e
    # propositalmente triviais: o container é criado do zero neste job e
    # destruído ao final, sem persistência e sem exposição fora do runner —
    # é o mesmo padrão usado nos exemplos oficiais do GitHub Actions para
    # "service containers". Não reutilize essas credenciais em nenhum banco
    # real (dev/staging/produção); para isso, use os secrets do repositório.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: template
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/template"
      DB_HOST: "127.0.0.1"
      DB_PORT: "3306"
      DB_USER: "root"
      DB_PASSWORD: "root"
      DB_NAME: "template"
      NEXTAUTH_URL: ${{ secrets.CI_NEXTAUTH_URL }}
      NEXTAUTH_SECRET: ${{ secrets.CI_NEXTAUTH_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.CI_ENCRYPTION_KEY }}
      RESEND_API_KEY: ${{ secrets.CI_RESEND_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prisma generate

      - run: pnpm exec prisma migrate deploy

      - run: pnpm build
